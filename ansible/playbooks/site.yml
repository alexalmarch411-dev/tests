---
# ============================================================
# Kafka Cluster Deployment Playbook
# ============================================================
# Usage:
#   ansible-playbook -i inventories/yandex/hosts.yml playbooks/site.yml
#
# Tags:
#   common    - System prerequisites
#   docker    - Docker installation
#   kafka     - Kafka deployment
#   topics    - Topic creation
#   healthcheck - Health verification
#   clickhouse - ClickHouse deployment
# ============================================================

- name: Deploy Kafka Cluster
  hosts: kafka
  become: true
  gather_facts: true
  serial: 1  # Rolling deployment for zero-downtime

  pre_tasks:
    - name: Validate connectivity
      ansible.builtin.ping:
      tags: [always]

    - name: Gather minimum facts
      ansible.builtin.setup:
        gather_subset:
          - min
          - network
          - distribution
      tags: [always]

  roles:
    - role: common
    - role: docker
    - role: kafka

  post_tasks:
    - name: Final cluster health verification
      ansible.builtin.debug:
        msg: "Kafka node {{ kafka_node_id }} deployment complete on {{ ansible_host }}"
      tags: [always]

# ============================================================
# Finalize Kafka Cluster
# Выполняется ПОСЛЕ развёртывания всех нод.
# KRaft-кворум требует большинства (2 из 3) — поэтому топики
# и healthcheck нельзя делать внутри serial:1 роли.
# ============================================================
- name: Finalize Kafka Cluster
  hosts: kafka
  become: true
  gather_facts: false
  tasks:
    - name: Wait for all Kafka brokers to become available
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ kafka_client_port }}"
        timeout: 120
        delay: 10
        state: started
      delegate_to: "{{ inventory_hostname }}"
      retries: 3
      delay: 5
      register: kafka_finalize_wait
      tags: [kafka, topics, healthcheck]

    - name: Create Kafka topics (run once)
      ansible.builtin.include_tasks:
        file: "../roles/kafka/tasks/topics.yml"
      run_once: true
      tags: [kafka, topics]

    - name: Run Kafka health checks (run once)
      ansible.builtin.include_tasks:
        file: "../roles/kafka/tasks/healthcheck.yml"
      run_once: true
      tags: [kafka, healthcheck]

- name: Deploy ClickHouse
  hosts: clickhouse
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate connectivity
      ansible.builtin.ping:

    - name: Gather minimum facts
      ansible.builtin.setup:
        gather_subset:
          - min
          - network
          - distribution

  roles:
    - role: common
    - role: docker
    - role: clickhouse

  post_tasks:
    - name: Verify ClickHouse
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ clickhouse_http_port }}/ping"
        method: GET
        status_code: 200
      register: ch_ping
      retries: 5
      delay: 3
      until: ch_ping.status == 200
