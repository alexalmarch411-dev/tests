---
# ============================================================
# Docker Container Management — IDEMPOTENT
# Using docker_container module, NOT shell commands
# ============================================================

- name: Create Docker network for Kafka
  community.docker.docker_network:
    name: "{{ kafka_docker_network }}"
    state: present
    driver: bridge
  tags: [kafka, docker, network]

- name: Pull Kafka Docker image
  community.docker.docker_image:
    name: "{{ kafka_image }}"
    source: pull
    force_source: false
  tags: [kafka, docker, image]

- name: Deploy Kafka container
  community.docker.docker_container:
    name: "{{ kafka_container_name }}"
    image: "{{ kafka_image }}"
    state: started
    restart_policy: unless-stopped
    restart: "{{ kafka_config_result is defined and kafka_config_result.changed | default(false) }}"
    # Host network: KRaft-кворум требует, чтобы нода могла достучаться до собственного
    # advertised IP. В bridge-сети hairpin NAT не работает — heartbeat к себе таймаутится.
    # Kafka сама управляет listeners (0.0.0.0), поэтому host-сеть безопасна.
    network_mode: host
    volumes:
      - "{{ kafka_host_data_dir }}/data:{{ kafka_data_dir }}"
      # Образ apache/kafka читает смонтированные конфиги из /mnt/shared/config
      - "{{ kafka_host_data_dir }}/server.properties:/mnt/shared/config/server.properties:ro"
      # Логи пишутся в ${kafka.logs.dir} = /opt/kafka/logs внутри контейнера
      - "{{ kafka_host_log_dir }}:/opt/kafka/logs"
    env:
      CLUSTER_ID: "{{ kafka_cluster_id }}"
      KAFKA_NODE_ID: "{{ kafka_node_id | string }}"
      KAFKA_HEAP_OPTS: "{{ kafka_heap_opts }}"
      KAFKA_JVM_PERFORMANCE_OPTS: "{{ kafka_jvm_performance_opts }}"
    ulimits:
      - "nofile:{{ common_ulimit_nofile }}:{{ common_ulimit_nofile }}"
    memory: "2g"
    memory_swap: "2g"
    oom_killer: true
    stop_timeout: 120
  register: kafka_container_result
  tags: [kafka, docker, container]

# NOTE: Ждать порт здесь НЕЛЬЗЯ. С serial:1 эта нода разворачивается раньше остальных,
# а KRaft-кворум требует 2 из 3 нод. Ожидание готовности вынесено в отдельный play
# "Finalize Kafka Cluster" (site.yml), который выполняется после развёртывания всех нод.
