---
# ============================================================
# Kafka Configuration — Jinja2 Template
# ============================================================

- name: Check server.properties path type
  ansible.builtin.stat:
    path: "{{ kafka_host_data_dir }}/server.properties"
  register: kafka_server_props_stat

- name: Remove erroneous directory at server.properties path
  ansible.builtin.file:
    path: "{{ kafka_host_data_dir }}/server.properties"
    state: absent
  when:
    - kafka_server_props_stat.stat.exists
    - kafka_server_props_stat.stat.isdir

- name: Generate Kafka server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_host_data_dir }}/server.properties"
    owner: root
    group: root
    # 0644: контейнер apache/kafka работает от appuser (UID 1000) и должен читать файл.
    # Файл не содержит секретов (PLAINTEXT) — мирно-читаемый безопасно.
    mode: "0644"
    backup: true
  register: kafka_config_result

- name: Generate Kafka log4j properties
  ansible.builtin.template:
    src: log4j.properties.j2
    dest: "{{ kafka_host_data_dir }}/log4j.properties"
    owner: root
    group: root
    mode: "0644"
  register: kafka_config_result
