---
- name: Force apt to use IPv4
  ansible.builtin.copy:
    content: |
      Acquire::ForceIPv4 "true";
      Acquire::Retries "10";
      Acquire::http::Timeout "120";
      Acquire::https::Timeout "120";
      Acquire::ftp::Timeout "120";
    dest: /etc/apt/apt.conf.d/99force-ipv4
    mode: "0644"
  tags: [common, packages]

- name: Prefer IPv4 in gai.conf
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    regexp: '^#?precedence ::ffff:0:0/96\s+100'
    line: 'precedence ::ffff:0:0/96  100'
  tags: [common, packages]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [common, packages]

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: [common, packages]

- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctl_params | dict2items }}"
  tags: [common, sysctl]

- name: Configure file limits
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    state: present
  loop:
    - "* soft nofile {{ common_ulimit_nofile }}"
    - "* hard nofile {{ common_ulimit_nofile }}"
  tags: [common, limits]

- name: Check if systemd-timesyncd service exists
  ansible.builtin.command: systemctl list-unit-files | grep -q systemd-timesyncd
  register: common_timesyncd_check
  changed_when: false
  failed_when: false
  tags: [common, ntp]

- name: Ensure systemd-timesyncd is running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
  when: common_timesyncd_check.rc == 0
  tags: [common, ntp]

- name: Install chrony when systemd-timesyncd is unavailable
  ansible.builtin.apt:
    name: chrony
    state: present
  when: common_timesyncd_check.rc != 0
  tags: [common, ntp]

- name: Ensure chrony is running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
  when: common_timesyncd_check.rc != 0
  tags: [common, ntp]

- name: Create kafka system group
  ansible.builtin.group:
    name: kafka
    system: true
    state: present
  tags: [common, users]

- name: Create kafka system user
  ansible.builtin.user:
    name: kafka
    group: kafka
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/kafka
    create_home: false
  tags: [common, users]

- name: Create kafka directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"
  loop:
    - /var/lib/kafka
    - /var/lib/kafka/data
    - /var/log/kafka
    - /etc/kafka
  tags: [common, directories]
