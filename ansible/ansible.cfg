[defaults]
inventory = inventories/yandex/hosts.yml
roles_path = roles
# remote_tmp НЕ задаём: по умолчанию ~/.ansible/tmp (per-user).
# Общий путь /tmp/.ansible/tmp приводил к конфликту прав между ubuntu и root (become).
forks = 10
timeout = 30
host_key_checking = True
retry_files_enabled = False
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent

[callback_default]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes
control_path_dir = /tmp/.ansible/cp
