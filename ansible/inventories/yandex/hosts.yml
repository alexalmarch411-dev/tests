---
all:
  children:
    kafka:
      hosts:
        kafka-1:
          # Внешний IP — для SSH из вашей рабочей машины
          ansible_host: "{{ lookup('env', 'KAFKA_1_PUBLIC_IP') | default('10.0.0.1', true) }}"
          # Внутренний IP — для Kafka-трафика (advertised.listeners, quorum)
          kafka_internal_ip: "{{ lookup('env', 'KAFKA_1_IP') | default('10.128.0.5', true) }}"
          kafka_node_id: 1
        kafka-2:
          ansible_host: "{{ lookup('env', 'KAFKA_2_PUBLIC_IP') | default('10.0.0.2', true) }}"
          kafka_internal_ip: "{{ lookup('env', 'KAFKA_2_IP') | default('10.128.0.6', true) }}"
          kafka_node_id: 2
        kafka-3:
          ansible_host: "{{ lookup('env', 'KAFKA_3_PUBLIC_IP') | default('10.0.0.3', true) }}"
          kafka_internal_ip: "{{ lookup('env', 'KAFKA_3_IP') | default('10.128.0.7', true) }}"
          kafka_node_id: 3
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_PRIVATE_KEY') | default('~/.ssh/id_ed25519', true) }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=60
          -o ServerAliveCountMax=3
    clickhouse:
      hosts:
        clickhouse-1:
          ansible_host: "{{ lookup('env', 'CLICKHOUSE_PUBLIC_IP') | default('10.0.0.10', true) }}"
          clickhouse_internal_ip: "{{ lookup('env', 'CLICKHOUSE_IP') | default('10.128.0.8', true) }}"
      vars:
        ansible_user: ubuntu